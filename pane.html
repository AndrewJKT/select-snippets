<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Select Snippets</title>

<style>
:root{--navy:#2E3D57;--orange:#F08A24;--grey:#F2F2F2;--line:#d9e0ea;--muted:#5f6b7a;--ok:#1b7a43;--bad:#b42318}
*{box-sizing:border-box}body{margin:0;font:13px/1.45 "Segoe UI",Calibri,Arial,sans-serif;color:#1f2a37;background:#fff}
header{background:var(--navy);color:#fff;padding:12px 14px}header .ey{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);font-weight:700}
header h1{margin:2px 0 0;font-size:16px}header .to{margin-top:6px;font-size:12px;color:#d6dde8;word-break:break-word}
main{padding:12px 14px}.grp{margin:12px 0 4px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tl button{display:block;width:100%;text-align:left;margin:4px 0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font:inherit;color:inherit}
.tl button:hover,.tl button.on{border-color:var(--orange);background:#fff8f1}
label{display:block;font-weight:600;font-size:12px;margin:8px 0 3px}input,select,textarea{width:100%;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff}
textarea{min-height:260px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
table.fee{width:100%;border-collapse:collapse;margin-top:6px}table.fee td,table.fee th{padding:3px 2px;font-size:12px;text-align:left}table.fee input,table.fee select{padding:4px 6px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.btn{border:0;border-radius:999px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer;background:var(--orange);color:#fff}
.btn.q{background:#fff;color:var(--navy);border:1px solid var(--navy)}.chk{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:12px}.chk input{width:auto}
.st{margin-top:10px;font-size:12px;color:var(--muted)}.st.ok{color:var(--ok)}.st.err{color:var(--bad)}.back{background:none;border:0;color:var(--navy);font:inherit;font-weight:700;cursor:pointer;padding:0;margin-bottom:6px}
.note{font-size:11px;color:var(--muted);margin-top:4px}
</style></head><body>

<script>
(function () {

  function tidyBullets(text) { var out = []; String(text || '').split('\n').forEach(function (l) { var m = l.match(BUL_RE); if (m) { var prev = out.length ? out[out.length - 1] : ''; if (prev.trim() && !BUL_RE.test(prev)) out.push(''); out.push(m[1].length >= 2 ? '    \u25e6 ' + m[2] : '\u2022 ' + m[2]); } else out.push(l); }); return out.join('\n'); }

    var UL = '<ul style="margin-top:0;margin-bottom:0;' + MAIL_STYLE + '">', LI = '<li style="' + MAIL_STYLE + '">';
    var flush = function () { if (!list.length) return; var h = UL, sub = false; list.forEach(function (it, i) { if (it.l === 0 || i === 0) { if (sub) { h += '</ul>'; sub = false; } if (i > 0) h += '</li>'; h += LI + lk(it.t); } else { if (!sub) { h += UL; sub = true; } h += LI + lk(it.t) + '</li>'; } }); if (sub) h += '</ul>'; out.push(h + '</li></ul>'); list = []; };
    var lk = function (x) { return e(x).replace(MD_LINK, '<a href="$2" style="color:rgb(5,99,193);text-decoration:underline">$1</a>'); };
    lines.forEach(function (l) { var m = l.match(BUL_RE); if (m) { list.push({ l: m[1].length >= 2 ? 1 : 0, t: m[2] }); return; } flush(); out.push('<div style="' + MAIL_STYLE + '">' + (l.trim() ? lk(l) : '<br>') + '</div>'); });
    flush();
    return out.join('');
  }
  function num(v) { var n = Number(String(v || '').replace(/[^\d.]/g, '')); return isFinite(n) ? n : 0; }
  var FEE_ROWS = [['fs', 'Fixed salary', [12, 13], 'f'], ['fa', 'Fixed allowances', [12, 13], 'f'], ['cm', 'Commission', [1, 4, 6, 12], 'v'], ['cb', 'Company performance bonus', [1, 2, 3, 4, 5, 6], 'v']];
  function feeText(v) {

  var TPLS = [
    { id: 'opp', g: 'Job opportunities', e: 'candidate', n: 'New job opportunity (written from the job)', ch: 'both', vars: ['sal', 'name', 'lang', 'opp'],

    { id: 'sim', g: 'Meetings', e: 'contact', n: 'Schedule an online meeting (booking link)', ch: 'email', vars: ['sal', 'name', 'book'], subj: function () { return 'Select Headhunter: Schedule an online discussion'; },

    { id: 'inr', g: 'Meetings', e: 'candidate', n: 'Interview reminder (WhatsApp)', ch: 'wa', vars: ['name', 'time', 'lang'], body: function (v) { return v.lang === 'id' ? 'Hai ' + v.name + ',\n\nSaya ingin mengingatkan bahwa kita punya wawancara online hari ini pada pukul ' + (v.time || '[waktu]') + '. Silakan bergabung 5 menit sebelum waktu mulai yang dijadwalkan.\nSaya menantikan percakapan dengan Anda nanti hari ini.' : 'Hi ' + v.name + ',\n\nI would like to remind you that we have an online interview scheduled for today at ' + (v.time || '[time]') + '. Please join 5 minutes before the scheduled start time. I look forward to speaking with you later today.'; } },
    { id: 'for', g: 'Terms of business', e: 'contact', n: 'Fee is high \u2013 22.5% and 20%', ch: 'email', vars: ['sal', 'name'], subj: function () { return 'Select Headhunter \u2013 terms of business'; },
      body: function (v) { return 'Hello ' + v.sal + ' ' + v.name + ',\n\nThank you for your response and for taking the time to review the terms of business I provided for Select Headhunter Indonesia\'s recruitment services. We appreciate your candid feedback regarding the fee structure, and I understand that cost considerations are a significant factor in making any business decision.\n\nAt Select Headhunter Indonesia, we recognize the importance of delivering exceptional value to our clients. Our team of experienced headhunters boasts an extensive professional network that enables us to identify and connect with the best talent available in the market. While we acknowledge your concern regarding the fee, our focus on building a highly experienced team of recruiters means we do not have a lot of margin for negotiation.\n\nHaving said that, I have been authorised to make an adjustment to the fee structure to 22.5% for non-exclusive assignments and 20% for exclusive assignments, which represents our best available price.\n\nIf you are happy with this proposal, I will send you revised terms of business to reflect our best available rate.\n\nThank you once again for considering Select Headhunter Indonesia as your recruitment partner. We look forward to the possibility of collaborating with you and showcasing the tangible benefits of our services.\n\nIf you have any further questions or would like to discuss this arrangement in more detail, please do not hesitate to reach out. We are here to assist you every step of the way.'; } },
    { id: 'fup', g: 'Terms of business', e: 'contact', n: 'Fee is high \u2013 first job special rate (last option)', ch: 'email', vars: ['sal', 'name'], subj: function () { return 'Select Headhunter \u2013 special rate for our first assignment'; },
      body: function (v) { return 'Hello ' + v.sal + ' ' + v.name + ',\n\nThank you for reviewing the terms of business for Select Headhunter Indonesia and for sharing your thoughts on the fee structure. I understand that cost is an important factor when choosing a recruitment partner.\n\nOur goal is to deliver strong value through our network, market knowledge, and the quality of candidates we can bring to you. While our standard fees reflect this, we also want to make it easier for you to experience our service firsthand.\n\nBased on your feedback, we are able to offer a special rate for your first job assignment with us:\n- 20% for a non-exclusive assignment\n- 18% for an exclusive assignment\n\nThis is a one-time adjustment to support our first collaboration. After that, our usual best rates of 22.5% (non-exclusive) and 20% (exclusive) will apply.\n\nIf you are happy with this proposal, I will prepare revised terms of business and a job assignment confirmation that includes the special rate for the first role you share.\n\nThank you again for considering Select Headhunter Indonesia. If you would like to discuss anything further, feel free to reach out anytime.'; } },
    { id: 'obv', g: 'Terms of business', e: 'contact', n: 'How the variable fee works', ch: 'email', vars: ['sal', 'name'], subj: function () { return 'Select Headhunter \u2013 how our fee works'; },
      body: function (v) { return 'Hello ' + v.sal + ' ' + v.name + ',\n\nThanks for your interest in understanding how our fees work at Select Headhunter Indonesia.\n\nDifferent recruitment firms use different methods. Some charge only on the fixed salary, while others charge a percentage on the full package, including bonuses and commissions. We take a middle-ground approach that we believe is fair and transparent.\n\nBecause performance-based income can vary and is not always guaranteed, we apply a reduced 10% fee on the variable portion. This keeps the pricing reasonable while still reflecting the full value of the role.\n\nTo keep things clear, here is how we calculate the variable component:\n- Annual performance bonus: we ask the client for the last two years of bonus payouts and use the average.\n- Sales commissions: we calculate based on achieving 100% of the sales target (on-target earnings).\n\nIf you would like to go through this in more detail or have any questions, I am happy to arrange a short call at your convenience.'; } },
    { id: 'ds', g: 'Terms of business', e: 'contact', n: 'Exclusive vs non-exclusive search', ch: 'email', vars: ['sal', 'name'], subj: function () { return 'Select Headhunter \u2013 exclusive and non-exclusive search'; },
      body: function (v) { return 'Hello ' + v.sal + ' ' + v.name + ',\n\nThanks for your question about the difference between our recruitment services. Here is a simple breakdown.\n\nFirst, the basics: our search process is the same for both exclusive and non-exclusive options. We put the same effort into finding and assessing candidates in either case.\n\nNon-exclusive search: you can use your own channels to find candidates while we search in parallel. It is flexible, and we work alongside your internal efforts.\n\nExclusive search: for six weeks, we become your only recruitment partner for the role. Your position becomes a priority for my team, and we focus our time and attention on delivering strong candidates.\n\nI usually recommend the exclusive option because it gives you better value and ensures your role gets dedicated focus from us. If you would like to talk through the options or have more questions, I am happy to set up a short call.'; } },

      body: function (v) { var f = feeText(v); return 'Hello ' + v.sal + ' ' + v.name + ',\n\nIn order to help you understand the way we charge for our service, I will provide you with an example of our fee for ' + (v.service === 'Exclusive' ? 'an exclusive' : 'a non-exclusive') + ' search service. This type of service charges a ' + v.fixed_pct + '% fee against the fixed amounts and a ' + v.var_pct + '% fee against performance or non-guaranteed amounts.\n\n' + f.lines + '\n\nIn this example the total fee payable would be ' + f.total + '.\n\n' + VARNOTE + '\n\nIf you would like to go through the numbers together or have other questions, I am happy to set up a short call.'; } },
    { id: 'exs', g: 'Terms of business', e: 'contact', n: 'Special offer with example fee (calculator)', ch: 'email', vars: ['sal', 'name', 'fee'], subj: function () { return 'Select Headhunter \u2013 special rate for our first assignment'; },
      body: function (v) { var f = feeText(v); return 'Hello ' + v.sal + ' ' + v.name + ',\n\nThank you for reviewing the terms of business for Select Headhunter Indonesia and for sharing your thoughts on the fee structure. I understand that cost is an important factor when choosing a recruitment partner.\n\nOur goal is to deliver strong value through our network, market knowledge, and the quality of candidates we can bring to you. While our standard fees reflect this, we also want to make it easier for you to experience our service firsthand.\n\nBased on your feedback, we are able to offer a special rate for your first job assignment with us:\n- 20% for a non-exclusive assignment\n- 18% for an exclusive assignment\n\nThis is a one-time adjustment to support our first collaboration. After that, our usual best rates of 22.5% (non-exclusive) and 20% (exclusive) will apply.\n\nTo help you understand the estimated fee, here is an example of the special fee I am offering: a ' + v.fixed_pct + '% fee against the fixed amounts and a ' + v.var_pct + '% fee against performance or non-guaranteed amounts.\n\n' + f.lines + '\n\nIn this example the total fee payable would be ' + f.total + '.\n\nIf you are happy with this proposal, I will prepare revised terms of business and a job assignment confirmation that includes the special rate for the first role you share.\n\nThank you again for considering Select Headhunter Indonesia. If you would like to discuss anything further, feel free to reach out anytime.'; } },
    { id: 'obl', g: 'Terms of business', e: 'contact', n: 'Employer of Record \u2013 obligations in Indonesia', ch: 'email', vars: ['sal', 'name'], subj: function () { return 'Employer of Record in Indonesia \u2013 employer obligations'; },
      body: function (v) { return 'Hello ' + v.sal + ' ' + v.name + ',\n\nAs you are considering using an Employer of Record service in Indonesia, I would like to provide insight into several fixed-term employment obligations that are unique to Indonesia and should be taken into consideration:\n\nFixed-term contracts: if a fixed-term employment contract is terminated before its agreed end date, the employer is generally obligated to compensate the employee for the remaining period of the contract.\n\nEnd-of-contract payment: at the conclusion of a fixed-term contract, employees are entitled to an end-of-contract payment (commonly referred to as uang kompensasi). This is calculated based on the length of service, typically one month\'s salary for every 12 months of service, pro-rated for shorter periods.\n\nBPJS contributions (mandatory social security): employers must register employees with BPJS programs:\n- BPJS Kesehatan (health insurance): employer contributes 4% of monthly salary, employee contributes 1%.\n- BPJS Ketenagakerjaan (employment social security): employer contributions vary by program:\n  - JKK (work accident insurance): 0.24% to 1.74% depending on risk classification.\n  - JKM (death insurance): 0.3%.\n  - JHT (old age savings): 3.7% employer + 2% employee.\n  - JP (pension): 2% employer + 1% employee, capped at a maximum salary base.\n\nOther obligations: employers must comply with statutory entitlements such as annual leave, sick leave and public holiday observance. Payroll must also be processed in accordance with Indonesian tax regulations.'; } },
    { id: 'inc', g: 'Indosat RPO', e: 'candidate', n: 'IOH interview confirmation', ch: 'email', vars: ['name', 'date', 'time', 'link', 'lang'], subj: function (v) { return v.lang === 'id' ? 'Konfirmasi wawancara \u2013 Indosat Ooredoo Hutchison' : 'Interview confirmation \u2013 Indosat Ooredoo Hutchison'; },
      body: function (v) { var L = v.lang === 'id'; return (L ? 'Hai ' + v.name + ',\n\nDengan ini kami mengonfirmasi bahwa Anda dijadwalkan untuk mengikuti wawancara online dengan Indosat Ooredoo Hutchison pada:\n\nTanggal: ' + (v.date || '[tanggal]') + '\nWaktu: ' + (v.time || '[waktu]') + '\nTautan pertemuan: ' + (v.link || '[link Teams]') + '\n\nWawancara akan menggunakan format standar dan diperkirakan berlangsung tidak lebih dari 30 menit. Mohon agar Anda mempersiapkan informasi berikut:\n- Total tahun pengalaman penjualan B2B\n- Target individu tahun 2026 (YTD)\n- Pencapaian individu terhadap target tahun 2026 (YTD)\n- Target individu tahun 2025\n- Pencapaian individu tahun 2025\n- Persentase pendapatan dari bisnis baru (hunting)\n- Persentase pendapatan dari bisnis berulang (gathering)\n- Sektor industri dari basis pelanggan Anda\n- Jenis produk yang dijual\n\nKarena jadwal wawancara kami cukup padat, kami mohon agar Anda memberikan pemberitahuan minimal 24 jam sebelumnya apabila perlu melakukan penjadwalan ulang.\n\nTerima kasih atas perhatian dan kerja samanya.\n\nHormat kami,\nTim Rekrutmen Indosat Ooredoo Hutchison' : 'Hi ' + v.name + ',\n\nWe are pleased to confirm that you are scheduled to attend an online interview with Indosat Ooredoo Hutchison on:\n\nDate: ' + (v.date || '[date]') + '\nTime: ' + (v.time || '[time]') + '\nMeeting link: ' + (v.link || '[Teams link]') + '\n\nThe interview will follow a standardized format and is expected to last no longer than 30 minutes. Please prepare the following information:\n- Total years of B2B sales experience\n- Your individual 2026 target (YTD)\n- Your individual achievement against the 2026 target (YTD)\n- Your individual 2025 target\n- Your individual achievement in 2025\n- Percentage of revenue from new business (hunting)\n- Percentage of revenue from repeat business (gathering)\n- Industry sector of your customer base\n- Types of products sold\n\nAs our interview schedule is very tight, we kindly ask that you provide at least 24 hours\' notice should you need to reschedule.\n\nThank you for your attention and cooperation.\n\nSincerely,\nRecruitment Team\nIndosat Ooredoo Hutchison'); } },
    { id: 'orm', g: 'Indosat RPO', e: 'candidate', n: 'IOH outreach', ch: 'both', vars: ['name', 'lang'], subj: function () { return 'Enterprise Sales opportunity \u2013 Indosat Ooredoo Hutchison'; },
      body: function (v) { return v.lang === 'id' ? 'Halo ' + v.name + ', saya ' + v.me + ' dari Indosat Ooredoo Hutchison (IOH). Saya telah meninjau profil Anda dan terkesan dengan latar belakang Anda di bidang penjualan B2B.\n\nSaya ingin mengundang Anda untuk mengikuti wawancara selama 30 menit untuk sebuah posisi di tim Enterprise Sales IOH. IOH adalah salah satu grup telekomunikasi terkemuka di Indonesia, dengan fokus yang kuat pada inovasi dan solusi enterprise. Posisi ini menawarkan kesempatan untuk bekerja sama dengan klien korporat besar dan berkontribusi pada pertumbuhan IOH di sektor B2B.\n\nTolong beri tahu ketersediaan waktu Anda.' : 'Hi ' + v.name + ', this is ' + v.me + ' from Indosat Ooredoo Hutchison (IOH). I have reviewed your profile and was impressed by your background in B2B sales.\n\nI would like to invite you to a 30-minute interview for a role with IOH in their Enterprise Sales team. IOH is one of Indonesia\'s leading telecom groups, with a strong focus on innovation and enterprise solutions. This position offers the chance to work with major corporate clients and contribute to IOH\'s growth in the B2B sector.\n\nPlease let me know your availability.'; } }

    aud.forEach(function (a) {
      var ts = LIST.filter(function (t) { return t.e === a[0] || t.e === 'both'; }); if (!ts.length) return;
      var groups = {}; ts.forEach(function (t) { (groups[t.g] = groups[t.g] || []).push(t); });
      Object.keys(groups).forEach(function (g) {
        var h = document.createElement('div'); h.className = 'grp'; h.textContent = a[1] + ' · ' + g; L.appendChild(h);
        var d = document.createElement('div'); d.className = 'tl'; groups[g].forEach(function (t) { var b = document.createElement('button'); b.type = 'button'; b.textContent = t.n; b.onclick = function () { open(t); }; d.appendChild(b); }); L.appendChild(d);
      });
    });
  }
  function open(t) {
    CUR = t; TV = {}; $('#list').hidden = true; var ed = $('#ed'); ed.hidden = false; var v = vars();
    var h = '<button class="back" type="button" id="back">← All templates</button><div style="font-weight:700;font-size:14px">' + esc(t.n) + '</div><div class="two">';
    if (t.vars.indexOf('sal') >= 0) h += '<div><label>Salutation</label><select data-v="sal"><option>Pak</option><option>Bu</option><option>Mas</option><option>Mbak</option></select></div>';
    if (t.vars.indexOf('name') >= 0) h += '<div><label>First name</label><input data-v="name"></div>';
    if (t.vars.indexOf('lang') >= 0) h += '<div><label>Language</label><select data-v="lang"><option value="en">English</option><option value="id">Bahasa Indonesia</option></select></div>';
    if (t.vars.indexOf('date') >= 0) h += '<div><label>Interview date</label><input data-v="date" placeholder="Monday 3 November 2026"></div>';
    if (t.vars.indexOf('time') >= 0) h += '<div><label>Time</label><input data-v="time" placeholder="10:00 WIB"></div>';
    h += '</div>';
    if (t.vars.indexOf('link') >= 0) h += '<label>Teams link</label><input data-v="link">';
    if (t.vars.indexOf('book') >= 0) h += '<label>Your Outlook booking link (remembered)</label><input data-v="book" placeholder="https://outlook.office.com/bookwithme/user/…">';
    if (t.vars.indexOf('fee') >= 0) {
      h += '<div class="two"><div><label>Service</label><select data-v="service"><option>Exclusive</option><option>Non-Exclusive</option></select></div><div class="two"><div><label>Fixed %</label><input data-v="fixed_pct"></div><div><label>Variable %</label><input data-v="var_pct"></div></div></div>' +
        '<table class="fee"><tr><th>Compensation</th><th>Monthly (Rp)</th><th>Months</th></tr>' + FEE_ROWS.map(function (r) { return '<tr><td>' + r[1] + '</td><td><input data-v="' + r[0] + '_amt" inputmode="numeric"></td><td><select data-v="' + r[0] + '_m">' + r[2].map(function (m) { return '<option>' + m + '</option>'; }).join('') + '</select></td></tr>'; }).join('') + '</table>';
    }
    h += '<label>Message</label><textarea id="body"></textarea><div class="note">The reply keeps the email’s own subject. Your Outlook signature is added by Outlook.</div>' +
      '<label class="chk"><input type="checkbox" id="log" checked> Log this reply on the person’s Vincere record</label>' +
      '<div class="btns"><button class="btn" type="button" id="rp">Reply in Outlook</button><button class="btn q" type="button" id="ra">Reply all</button><button class="btn q" type="button" id="cp">Copy</button></div><div class="st" id="st"></div>';
    ed.innerHTML = h; $('#back').onclick = drawList;
    [].forEach.call(ed.querySelectorAll('[data-v]'), function (i) {
      var k = i.dataset.v;
      if (k === 'sal') i.value = v.sal; else if (k === 'name') i.value = v.name; else if (k === 'book') i.value = v.book; else if (k === 'fixed_pct') i.value = t.id === 'exs' ? '18' : '20'; else if (k === 'var_pct') i.value = '10'; else if (/_m$/.test(k)) i.value = /^f/.test(k) ? '13' : (k === 'cm_m' ? '12' : '1');
      TV[k] = i.value;
      i.addEventListener('input', function () {
        TV[k] = i.value; if (k === 'book') LS.set('booklink', i.value.trim());
        if (k === 'service') { var fp = ed.querySelector('[data-v=fixed_pct]'); fp.value = CUR.id === 'exs' ? (i.value === 'Exclusive' ? '18' : '20') : (i.value === 'Exclusive' ? '20' : '22.5'); TV.fixed_pct = fp.value; }
        fill();
      });
      i.addEventListener('change', function () { i.dispatchEvent(new Event('input')); });
    });
    $('#rp').onclick = function () { reply(false); }; $('#ra').onclick = function () { reply(true); }; $('#cp').onclick = copy;
    fill();
  }
  function fill() { $('#body').value = tidyBullets(CUR.body(vars())); }
  function msg(t, c) { var s = $('#st'); s.className = 'st' + (c ? ' ' + c : ''); s.textContent = t; }
  function html(text) { return mailHtml(text) + '<div style="' + MAIL_STYLE + '"><br></div>'; } // blank line before Outlook adds the signature
  function copy() { var b = linkPlain($('#body').value); try { navigator.clipboard.writeText(b).then(function () { msg('Copied.', 'ok'); }, function () { msg('Select the text and press Ctrl+C.', 'err'); }); } catch (e) { msg('Select the text and press Ctrl+C.', 'err'); } }
  function reply(all) {
    if (!ITEM) { msg('Open an email first.', 'err'); return; }
    var body = $('#body').value, h = html(body);
    try { if (all) ITEM.displayReplyAllForm({ htmlBody: h }); else ITEM.displayReplyForm({ htmlBody: h }); } catch (e) { msg('Outlook could not open the reply: ' + e.message, 'err'); return; }
    if (!$('#log').checked) { msg('Reply opened. Check it and press Send.', 'ok'); return; }
    msg('Reply opened. Logging it on Vincere…');
    // ONE n8n run: find the sender in Vincere and log the reply on their record
    fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ k: K, action: 'log_by_email', type: 'contact', prefer: CUR.e === 'candidate' ? 'candidate' : 'contact', email: FROM.email, subject: 'RE: ' + (ITEM.subject || ''), body: linkPlain(body), channel: 'Email' }) })
      .then(function (r) { return r.json(); }).then(function (j) {
        if (j && j.ok && j.logged) msg('Reply opened, and logged on ' + j.found.name + '’s Vincere record (' + (j.found.type === 'contact' ? 'client contact' : 'candidate') + ').', 'ok');
        else if (j && j.ok && j.found === false) msg('Reply opened. ' + FROM.email + ' is not in Vincere, so nothing was logged.', 'err');
        else { msg('Reply opened, but it was not logged: ' + ((j && j.error) || 'unknown error'), 'err'); if (j && /key/i.test(j.error || '')) { K = ''; LS.set('key', ''); try { Office.context.roamingSettings.remove('shkey'); Office.context.roamingSettings.saveAsync(); } catch (e) {} } }
      }).catch(function (e) { msg('Reply opened, but it was not logged (' + e.message + ').', 'err'); });
  }
  function getKey() { try { K = Office.context.roamingSettings.get('shkey') || ''; } catch (e) {} if (!K) K = LS.get('key') || ''; return K; }
  function askKey(cb) {
    var b = $('#keyBox'); b.hidden = false; $('#list').hidden = true; $('#ed').hidden = true;
    $('#keySave').onclick = function () { var v = $('#keyIn').value.trim(); if (!v) return; K = v; LS.set('key', v); try { Office.context.roamingSettings.set('shkey', v); Office.context.roamingSettings.saveAsync(); } catch (e) {} b.hidden = true; cb(); };
  }
  function load() {
    ITEM = Office.context.mailbox && Office.context.mailbox.item; ME = (Office.context.mailbox && Office.context.mailbox.userProfile && Office.context.mailbox.userProfile.displayName) || '';
    if (ITEM && ITEM.from) { FROM = { name: ITEM.from.displayName || '', email: String(ITEM.from.emailAddress || '').toLowerCase() }; $('#to').textContent = 'Replying to ' + (FROM.name || FROM.email) + (FROM.name ? ' <' + FROM.email + '>' : ''); }
    else $('#to').textContent = 'Open an email to reply to.';
    if (CUR) open(CUR); else drawList();
  }
  Office.onReady(function () {
    if (!getKey()) askKey(load); else load();
    try { Office.context.mailbox.addHandlerAsync(Office.EventType.ItemChanged, function () { CUR = null; load(); }); } catch (e) {}
  });
})();
</script>
